  group: content_completeness
  verifiability: lint
  detector: "problem statement không chứa con số hoặc mức ảnh hưởng cụ thể"
  on_fail: [gap]
  severity_default: medium
  templates: [standard, comprehensive, google]

- id: GOALS-SMART
  text: Mục tiêu đo lường được (SMART)
  group: content_completeness
  verifiability: lint
  detector: "goal không chứa con số hoặc tiêu chí đo"
